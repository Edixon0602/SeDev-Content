<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SeDev Scene Runner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      background: #050505;
      color: #ffffff;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    #stage {
      width: 1080px;
      height: 1920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transform-origin: center center;
      will-change: transform;
    }

    /* Minimalist Monospace Header (Zero AI-Slop, NO PILLS, NO BORDERS) */
    .scene-category {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #71717a;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* 1. Kinetic Hook Styling */
    .comp-kinetic-hook {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 960px;
    }
    .kh-icon-wrap {
      margin-bottom: 30px;
      filter: drop-shadow(0 6px 0px #09090b);
    }
    .kh-lines {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }
    .kh-line {
      font-size: 84px;
      font-weight: 900;
      letter-spacing: -2.5px;
      line-height: 1.05;
      text-transform: uppercase;
      paint-order: stroke fill;
      -webkit-text-stroke: 8px #09090b;
      filter: drop-shadow(0 6px 0px #09090b);
    }
    .kh-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      color: #71717a;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* 2. Architecture Flow Styling */
    .comp-arch-flow {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 960px;
    }
    .arch-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #71717a;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    /* 3. Code Terminal Styling */
    .comp-code-terminal {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 940px;
    }
    .ct-window {
      width: 100%;
      background: #0d0d11;
      border: 1.5px solid #27272a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.8);
      margin-bottom: 26px;
    }
    .ct-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      background: #141418;
      border-bottom: 1.5px solid #27272a;
    }
    .ct-dots {
      display: flex;
      gap: 8px;
    }
    .ct-dots .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
    }
    .ct-dots .red { background: #ef4444; }
    .ct-dots .yellow { background: #f59e0b; }
    .ct-dots .green { background: #10b981; }
    .ct-filename {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: #d4d4d8;
      font-weight: 600;
    }
    .ct-lang {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #71717a;
      font-weight: 700;
    }
    .ct-editor {
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 21px;
      line-height: 1.4;
    }
    .ct-line {
      display: flex;
      gap: 20px;
    }
    .ct-line.highlight {
      background: rgba(251, 191, 36, 0.12);
      border-left: 3px solid #fbbf24;
      padding-left: 8px;
      margin-left: -11px;
    }
    .ct-linenum {
      color: #3f3f46;
      user-select: none;
      font-size: 17px;
      width: 28px;
    }
    .ct-linetext .kw { color: #f43f5e; font-weight: 700; }
    .ct-linetext .fn { color: #38bdf8; font-weight: 600; }
    .ct-linetext .str { color: #34d399; }
    .ct-linetext .comm { color: #52525b; font-style: italic; }

    .ct-terminal {
      width: 100%;
      background: #09090b;
      border: 1.5px solid #27272a;
      border-radius: 14px;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
    }
    .term-bar {
      display: flex;
      justify-content: space-between;
      padding: 10px 18px;
      background: #121215;
      border-bottom: 1px solid #27272a;
      font-size: 13px;
      color: #71717a;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .term-status {
      color: #10b981;
    }
    .term-body {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .term-cmd {
      display: flex;
      gap: 12px;
      font-size: 18px;
      color: #ffffff;
    }
    .term-cmd .prompt { color: #10b981; font-weight: 700; }
    .term-out {
      font-size: 16px;
      color: #a1a1aa;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    /* 4. Metrics Comparison Styling */
    .comp-metrics-comp {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 940px;
    }
    .mc-title {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 36px;
      text-transform: uppercase;
      color: #ffffff;
    }
    .mc-cards {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
      margin-bottom: 34px;
    }
    .mc-card {
      background: #0d0d11;
      border: 1.5px solid #27272a;
      border-radius: 16px;
      padding: 26px 30px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .mc-card.winner {
      border-color: #10b981;
      background: #081a13;
    }
    .mc-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mc-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #d4d4d8;
    }
    .mc-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      background: #27272a;
      color: #a1a1aa;
    }
    .mc-tag.green {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .mc-num {
      font-size: 58px;
      font-weight: 900;
      letter-spacing: -1.5px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .mc-bar-track {
      width: 100%;
      height: 12px;
      background: #18181b;
      border-radius: 6px;
      overflow: hidden;
    }
    .mc-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.05s linear;
    }
    .mc-delta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 36px;
      border-radius: 8px;
      background: #10b981;
      border: 3px solid #09090b;
      box-shadow: 0 6px 0px #09090b;
      color: #052e16;
    }
    .mc-delta-icon { font-size: 26px; }
    .mc-delta-text {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    /* 5. Memory Layout Styling */
    .comp-memory-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 960px;
    }
    .ml-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 30px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .ml-table {
      width: 100%;
      background: #0d0d11;
      border: 1.5px solid #27272a;
      border-radius: 16px;
      padding: 18px 24px;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 28px;
    }
    .ml-table-head {
      display: flex;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
      color: #71717a;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .ml-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #18181b;
      font-size: 17px;
    }
    .ml-row:last-child { border-bottom: none; }
    .ml-addr {
      color: #38bdf8;
      font-weight: 700;
      width: 140px;
    }
    .ml-bytes {
      display: flex;
      gap: 10px;
    }
    .ml-bytes .byte {
      color: #d4d4d8;
      background: #18181b;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 16px;
    }
    .ml-bytes .byte.lead {
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
      font-weight: 700;
    }
    .ml-label {
      color: #a1a1aa;
      font-size: 15px;
      font-weight: 600;
      width: 220px;
      text-align: right;
    }

    .ml-latency {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
    }
    .lat-box {
      flex: 1;
      background: #0d0d11;
      border: 1.5px solid #27272a;
      border-radius: 14px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .lat-box.ram { border-color: #10b981; }
    .lat-box.nvme { border-color: #ef4444; }
    .lat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #71717a;
      letter-spacing: 1px;
    }
    .lat-val {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -1px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .lat-box.ram .lat-val { color: #10b981; }
    .lat-box.nvme .lat-val { color: #ef4444; }
    .lat-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #a1a1aa;
      font-weight: 600;
    }
    .lat-vs {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 900;
      color: #52525b;
    }
  </style>
</head>
<body>

  <div id="stage"></div>

  <script>
    // Component Registry defined BEFORE scripts execute
    window.__COMPONENTS__ = {};
    window.registerComponent = function(name, def) {
      window.__COMPONENTS__[name] = def;
    };
  </script>

  <!-- Component Scripts & Icons -->
  <script src="components/icons_sedev.js"></script>
  <script src="components/kinetic_hook.js"></script>
  <script src="components/architecture_flow.js"></script>
  <script src="components/code_terminal.js"></script>
  <script src="components/metrics_comparison.js"></script>
  <script src="components/memory_layout.js"></script>
  <script src="components/tree_hierarchy.js"></script>
  <script src="components/network_pipeline.js"></script>
  <script src="components/latency_scale.js"></script>
  <script src="components/tradeoff_matrix.js"></script>
  <script src="components/terminal_split.js"></script>
  <script src="components/storage_engine_viz.js"></script>
  <script src="components/connection_pool_viz.js"></script>
  <script src="components/kernel_sandbox_viz.js"></script>
  <script src="components/cache_flow_viz.js"></script>
  <script src="components/migration_stepper_viz.js"></script>
  <script src="components/quantization_weights_viz.js"></script>

  <script>
    // Math Utilities
    const utils = {
      spring(dt, omega = 24, zeta = 0.65) {
        if (dt <= 0) return 0;
        const decay = Math.exp(-zeta * omega * dt);
        const beta = omega * Math.sqrt(1 - zeta * zeta);
        return 1 - decay * (Math.cos(beta * dt) + (zeta / Math.sqrt(1 - zeta * zeta)) * Math.sin(beta * dt));
      },
      clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      },
      lerp(a, b, t) {
        return a + (b - a) * t;
      }
    };

    let currentScene = null;
    let currentComponent = null;
    const stageEl = document.getElementById('stage');

    window.loadScene = function(sceneData) {
      currentScene = sceneData;
      stageEl.innerHTML = '';
      const compDef = window.__COMPONENTS__[sceneData.type];
      if (!compDef) {
        stageEl.innerHTML = `<div style="color:red; font-size:32px;">Component not found: ${sceneData.type}</div>`;
        return;
      }
      currentComponent = compDef;
      if (typeof compDef.init === 'function') {
        compDef.init(stageEl, sceneData.props || {});
      }
    };

    window.renderFrame = function(timeInSeconds) {
      if (!currentScene || !currentComponent) return;
      const duration = currentScene.duration || 5.0;
      const t = utils.clamp(timeInSeconds, 0, duration);

      // Subtle dynamic camera push-in so the screen is never dead/frozen
      const camPush = 1.0 + (t / duration) * 0.035;
      stageEl.style.transform = `scale(${camPush.toFixed(4)})`;

      currentComponent.render(stageEl, t, duration, currentScene.props || {}, utils);
    };

    // URL Query Parameter bootstrap (for direct testing in browser)
    const urlParams = new URLSearchParams(window.location.search);
    const sceneType = urlParams.get('type') || 'kinetic_hook';
    const duration = parseFloat(urlParams.get('duration') || '5.0');

    // Default test scene if not injected by Puppeteer or Player
    if (!window.__SCENE_DATA__) {
      window.loadScene({
        id: 'test_scene',
        type: sceneType,
        duration: duration,
        props: {
          badge: 'SYSTEM ARCHITECTURE',
          lines: [
            { text: '¿POR QUÉ REDIS', color: '#ffffff' },
            { text: 'ES TAN RÁPIDO?', color: '#fbbf24' }
          ],
          subtitle: 'ANÁLISIS DE RENDIMIENTO INTERNO // 100K REQ/S',
          icon: 'lightning'
        }
      });
    } else {
      window.loadScene(window.__SCENE_DATA__);
    }

    // Interactive Loop when previewing directly in Chrome
    if (!window.__PUPPETEER_CAPTURE__ && urlParams.get('preview') === '1') {
      let start = null;
      function previewLoop(now) {
        if (!start) start = now;
        const elapsed = (now - start) / 1000;
        window.renderFrame(elapsed % (currentScene.duration || 5.0));
        requestAnimationFrame(previewLoop);
      }
      requestAnimationFrame(previewLoop);
    } else if (!window.__PUPPETEER_CAPTURE__) {
      // Default to settled frame 2.0s
      window.renderFrame(Math.min(2.0, (currentScene?.duration || 5.0) - 0.5));
    }
  </script>
</body>
</html>
