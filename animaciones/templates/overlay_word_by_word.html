<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay SeDev Editorial Kinetic</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=JetBrains+Mono:wght@700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 1000px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      min-height: 108px;
    }

    /* Standard floating kinetic word - crisp 6px contour, ZERO blurry smudge */
    .word {
      position: relative;
      display: inline-flex;
      align-items: center;
      font-size: 82px;
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1.05;
      color: #ffffff;
      paint-order: stroke fill;
      -webkit-text-stroke: 7px #09090b;
      filter: drop-shadow(0 5px 0px #09090b);
      transform-origin: center bottom;
      will-change: transform, opacity;
      opacity: 0;
    }

    /* Anchor 1: ¿Anthropic with terracotta fill + animated underline bar */
    .word-anthropic {
      color: #ff6b4a;
    }

    /* Anchor 2: pagar in warm gold */
    .word-pagar {
      color: #fbbf24;
    }

    /* Anchor 3: salario? inside a crisp kinetic highlighter block */
    .word-salario-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 24px 8px 24px;
      border-radius: 16px;
      background: #10b981;
      border: 4px solid #09090b;
      box-shadow: 0 6px 0px #09090b;
      font-size: 80px;
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1.0;
      color: #052e16;
      transform-origin: left center;
      will-change: transform, opacity;
      opacity: 0;
    }

    /* Animated Icon Containers - crisp vector borders, ZERO blurry smudge */
    .icon-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transform-origin: center center;
      will-change: transform, opacity;
      opacity: 0;
      filter: drop-shadow(0 5px 0px #09090b);
    }
  </style>
</head>
<body>

  <div class="stage">
    <!-- ROW 1: [Icon Claude] ¿Anthropic -->
    <div class="row">
      <div class="icon-box" id="iconClaude">
        <svg viewBox="0 0 80 80" width="78" height="78">
          <rect x="6" y="6" width="68" height="68" rx="18" fill="#18181b" stroke="#09090b" stroke-width="5"/>
          <rect x="9" y="9" width="62" height="62" rx="15" fill="none" stroke="#ff6b4a" stroke-width="2.5"/>
          <g id="claudeStar" style="transform-origin: 40px 40px;">
            <path d="M40 15 L45.5 34.5 L65 40 L45.5 45.5 L40 65 L34.5 45.5 L15 40 L34.5 34.5 Z" fill="#ff6b4a"/>
            <circle cx="40" cy="40" r="4" fill="#ffffff"/>
          </g>
        </svg>
      </div>
      <span class="word word-anthropic" id="w0">¿Anthropic</span>
    </div>

    <!-- ROW 2: va a pagar [Icon Arrow] -->
    <div class="row">
      <span class="word" id="w1">va</span>
      <span class="word" id="w2">a</span>
      <span class="word word-pagar" id="w3">pagar</span>
      <div class="icon-box" id="iconArrow">
        <svg viewBox="0 0 74 74" width="74" height="74">
          <circle cx="37" cy="37" r="31" fill="#18181b" stroke="#09090b" stroke-width="5"/>
          <circle cx="37" cy="37" r="28" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
          <g id="arrowGlyph">
            <path d="M23 37 H49 M40 26 L51 37 L40 48" fill="none" stroke="#fbbf24" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- ROW 3: tu próximo [salario?] [Icon Fanning Cash] -->
    <div class="row">
      <span class="word" id="w4">tu</span>
      <span class="word" id="w5">próximo</span>
      <span class="word-salario-pill" id="w6">salario?</span>
      <div class="icon-box" id="iconCash">
        <svg viewBox="0 0 96 84" width="94" height="82">
          <!-- Back bill -->
          <g id="billBack" style="transform-origin: 48px 50px;">
            <rect x="12" y="18" width="68" height="44" rx="8" fill="#047857" stroke="#09090b" stroke-width="5"/>
            <rect x="18" y="24" width="56" height="32" rx="4" fill="none" stroke="#34d399" stroke-width="2"/>
          </g>
          <!-- Front bill -->
          <g id="billFront" style="transform-origin: 48px 50px;">
            <rect x="14" y="22" width="68" height="44" rx="8" fill="#10b981" stroke="#09090b" stroke-width="5"/>
            <rect x="21" y="28" width="54" height="32" rx="4" fill="none" stroke="#064e3b" stroke-width="2.5"/>
            <circle cx="48" cy="44" r="9" fill="#064e3b"/>
            <path d="M48 38 v12 M51 41 c0-1.5-1.5-2-3-2 s-3 .5-3 2 1.5 1.8 3 2.2 3 .7 3 2.3 -1.5 2-3 2 -3-.5-3-2" stroke="#ecfdf5" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <script>
    const schedule = [
      { el: document.getElementById('iconClaude'), start: 0.04, type: 'icon' },
      { el: document.getElementById('w0'),         start: 0.10, type: 'word', accent: true },
      { el: document.getElementById('w1'),         start: 0.50, type: 'word' },
      { el: document.getElementById('w2'),         start: 0.68, type: 'word' },
      { el: document.getElementById('w3'),         start: 0.86, type: 'word', accent: true },
      { el: document.getElementById('iconArrow'),  start: 0.94, type: 'icon' },
      { el: document.getElementById('w4'),         start: 1.30, type: 'word' },
      { el: document.getElementById('w5'),         start: 1.50, type: 'word' },
      { el: document.getElementById('w6'),         start: 1.78, type: 'pill', accent: true },
      { el: document.getElementById('iconCash'),   start: 1.88, type: 'icon' }
    ];

    const claudeStar = document.getElementById('claudeStar');
    const arrowGlyph = document.getElementById('arrowGlyph');
    const billBack = document.getElementById('billBack');
    const billFront = document.getElementById('billFront');

    function springPop(dt) {
      if (dt <= 0) return 0;
      const omega = 24;
      const zeta = 0.64;
      const decay = Math.exp(-zeta * omega * dt);
      const beta = omega * Math.sqrt(1 - zeta * zeta);
      return 1 - decay * (Math.cos(beta * dt) + (zeta / Math.sqrt(1 - zeta * zeta)) * Math.sin(beta * dt));
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    window.renderFrame = function(timeInSeconds) {
      const t = clamp(timeInSeconds, 0, 3.0);

      schedule.forEach(item => {
        const dt = t - item.start;
        if (dt < 0) {
          item.el.style.opacity = '0';
          item.el.style.transform = 'translateY(32px) scale(0.65)';
        } else {
          const s = springPop(dt);
          const opacity = clamp(dt / 0.06, 0, 1);
          const translateY = (1 - s) * 32;
          const activeBoost = item.accent ? Math.max(0, Math.sin(clamp(dt / 0.25, 0, 1) * Math.PI) * 0.08) : 0;
          const scale = (0.65 + 0.35 * s) + activeBoost;
          const rot = item.type === 'pill' ? (1 - s) * -3 : (1 - s) * -5;

          item.el.style.opacity = opacity.toFixed(3);
          item.el.style.transform = `translateY(${translateY.toFixed(1)}px) scale(${scale.toFixed(3)}) rotate(${rot.toFixed(2)}deg)`;
        }
      });

      // Secondary SVG micro-animations
      const dtClaude = Math.max(0, t - 0.04);
      const starSpin = (1 - clamp(springPop(dtClaude), 0, 1)) * -90 + dtClaude * 18;
      claudeStar.style.transform = `rotate(${starSpin.toFixed(1)}deg)`;

      const dtArrow = Math.max(0, t - 0.94);
      const arrowShift = (1 - clamp(springPop(dtArrow), 0, 1)) * -14 + Math.sin(dtArrow * 7) * 3;
      arrowGlyph.style.transform = `translateX(${arrowShift.toFixed(1)}px)`;

      const dtCash = Math.max(0, t - 1.88);
      const fanProgress = clamp(springPop(dtCash), 0, 1.2);
      billBack.style.transform = `rotate(${(-14 * fanProgress).toFixed(1)}deg) translateY(${(-6 * fanProgress).toFixed(1)}px)`;
      billFront.style.transform = `rotate(${(4 * fanProgress).toFixed(1)}deg)`;
    };

    if (!window.__PUPPETEER_CAPTURE__) {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('preview') === '1') {
        let start = null;
        function loop(now) {
          if (!start) start = now;
          const elapsed = (now - start) / 1000;
          window.renderFrame(Math.min(elapsed, 3.0));
          if (elapsed < 3.0) requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      } else {
        window.renderFrame(2.5);
      }
    }
  </script>
</body>
</html>
