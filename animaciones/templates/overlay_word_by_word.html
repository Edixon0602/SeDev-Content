<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay SeDev — Kinetic Word by Word v2</title>
  <style>
    /* Verified variable axes: Plus Jakarta wght 200–800, JetBrains 400–800. */
    @font-face {
      font-family: 'Plus Jakarta Sans';
      font-style: normal;
      font-weight: 200 800;
      font-display: block;
      src: url('../assets/fonts/plus-jakarta-sans-variable.woff2') format('woff2');
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400 800;
      font-display: block;
      src: url('../assets/fonts/jetbrains-mono-variable.woff2') format('woff2');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    html, body {
      width: 1080px;
      height: 1920px;
      background: transparent !important;
      overflow: hidden;
    }

    #stage {
      position: absolute;
      left: 40px;
      bottom: 270px;
      width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      will-change: transform, opacity;
      transform-origin: center bottom;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .kicker-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      padding-left: 20px;
    }
    .kicker-bar {
      width: 7px;
      height: 42px;
      background: #fbbf24;
      transform-origin: left center;
      will-change: transform;
    }
    .kicker-copy {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
    }
    .kicker-copy span {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #d4d4d8;
      text-transform: uppercase;
      will-change: transform, opacity;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      min-height: 104px;
      width: 100%;
    }

    .word {
      display: inline-block;
      font-size: 80px;
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1.02;
      color: #ffffff;
      paint-order: stroke fill;
      -webkit-text-stroke: 7px #09090b;
      filter: drop-shadow(0 6px 0 #09090b);
      transform-origin: center bottom;
      white-space: nowrap;
      will-change: transform, opacity;
      opacity: 0;
    }
    .word.accent { color: #ff6b4a; }
    .word.gold { color: #fbbf24; }

    /* Tight word highlight, not a card: only the word is boxed. */
    .word-box {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 20px 8px 20px;
      transform-origin: left bottom;
      will-change: transform, opacity;
      opacity: 0;
    }
    .word-box .box-bg {
      position: absolute;
      inset: 0;
      background: #10b981;
      border: 4px solid #09090b;
      transform-origin: left center;
      will-change: transform;
    }
    .word-box .box-copy {
      position: relative;
      z-index: 1;
      display: inline-block;
      font-size: 78px;
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1;
      color: #052e16;
      white-space: nowrap;
    }
    .word-box .box-underline {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: -14px;
      height: 7px;
      background: #fbbf24;
      transform-origin: left center;
      will-change: transform;
      z-index: 2;
    }

    .icon-slot {
      position: relative;
      width: 88px;
      height: 88px;
      flex: 0 0 auto;
      transform-origin: center center;
      will-change: transform, opacity;
      opacity: 0;
    }

    .footline {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 6px 20px 0 20px;
      opacity: 0;
      will-change: transform, opacity;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.8px;
      color: #71717a;
      white-space: nowrap;
    }
    .foot-rule {
      flex: 1;
      height: 1.5px;
      background: #3f3f46;
      transform-origin: left center;
      will-change: transform;
    }
    .beat {
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="kicker-row">
      <div class="kicker-bar" id="kickerBar"></div>
      <div class="kicker-copy"><span id="kickerText">SEÑAL // INGRESOS</span></div>
    </div>

    <div class="row">
      <div class="icon-slot" id="iconA"></div>
      <span class="word accent" id="w0">¿ANTHROPIC</span>
    </div>

    <div class="row">
      <span class="word" id="w1">VA A</span>
      <span class="word gold" id="w2">PAGAR</span>
      <div class="icon-slot" id="iconB"></div>
    </div>

    <div class="row">
      <span class="word" id="w3">TU PRÓXIMO</span>
      <div class="word-box" id="w4box">
        <div class="box-bg" id="w4bg"></div>
        <span class="box-copy" id="w4">SALARIO?</span>
        <div class="box-underline" id="w4line"></div>
      </div>
      <div class="icon-slot" id="iconC"></div>
    </div>

    <div class="footline" id="footline">
      <span class="mono">SEDEV // MOTION</span>
      <div class="foot-rule" id="footRule"></div>
      <span class="mono beat" id="beatLabel">BEAT 01 / 04</span>
    </div>
  </div>

  <script src="components/motion_core.js"></script>
  <script src="components/icons_sedev.js"></script>
  <script src="components/icons_animated.js"></script>
  <script>
    (function () {
      const MC = window.MotionCore;
      const DURATION = 3.2;
      const stage = document.getElementById('stage');
      const kickerBar = document.getElementById('kickerBar');
      const kickerText = document.getElementById('kickerText');
      const footline = document.getElementById('footline');
      const footRule = document.getElementById('footRule');
      const beatLabel = document.getElementById('beatLabel');
      const w4box = document.getElementById('w4box');
      const w4bg = document.getElementById('w4bg');
      const w4line = document.getElementById('w4line');

      const words = [
        { el: document.getElementById('w0'), start: 0.10, rot: -3 },
        { el: document.getElementById('w1'), start: 0.34, rot: 2 },
        { el: document.getElementById('w2'), start: 0.44, rot: -2 },
        { el: document.getElementById('w3'), start: 0.66, rot: 1 }
      ];

      const beatTimes = [0.10, 0.44, 0.80, 1.45];

      // Icons reuse the shared SVG catalog and the animated icon layer.
      const iconA = window.SedevIconAnim.create(document.getElementById('iconA'), {
        name: 'llm_brain', size: 88, color: '#ff6b4a', mode: 'draw', start: 0.03, dur: 0.42
      });
      const iconB = window.SedevIconAnim.create(document.getElementById('iconB'), {
        name: 'scale_balance', size: 88, color: '#fbbf24', mode: 'assemble', start: 0.52, dur: 0.42
      });
      const iconC = window.SedevIconAnim.create(document.getElementById('iconC'), {
        name: 'terminal', size: 88, color: '#10b981', mode: 'draw', start: 0.94, dur: 0.42
      });
      const iconSlots = [
        document.getElementById('iconA'),
        document.getElementById('iconB'),
        document.getElementById('iconC')
      ];
      const iconStarts = [0.02, 0.52, 0.94];

      function setWord(el, t, start, rot) {
        const p = MC.progress(t, start, 0.34, 'outQuint');
        const pop = MC.progress(t, start, 0.42, 'outBack');
        const y = (1 - p) * 34;
        const scale = 0.72 + 0.28 * pop;
        el.style.opacity = String(MC.clamp01(p * 1.15));
        el.style.transform = `translateY(${y.toFixed(2)}px) scale(${scale.toFixed(3)}) rotate(${((1 - p) * rot).toFixed(2)}deg)`;
      }

      window.renderFrame = function (timeInSeconds) {
        const t = MC.clamp(Number(timeInSeconds) || 0, 0, DURATION);
        const exitStart = DURATION - 0.35;
        const ex = MC.progress(t, exitStart, 0.35, 'outCubic');
        const enter = MC.progress(t, 0, 0.18, 'outCubic');

        stage.style.opacity = String(MC.clamp01(enter * (1 - ex)));
        stage.style.transform = `translateY(${(ex * 34).toFixed(2)}px) scale(${(1 - ex * 0.03).toFixed(4)})`;

        // Kicker: bar grows, then copy wipes left-to-right.
        const barP = MC.progress(t, 0.0, 0.28, 'outExpo');
        kickerBar.style.transform = `scaleY(${barP.toFixed(3)})`;
        const copyP = MC.progress(t, 0.08, 0.34, 'outExpo');
        kickerText.style.opacity = String(MC.clamp01(copyP * 1.4));
        kickerText.style.transform = `translateX(${((1 - copyP) * -24).toFixed(2)}px)`;
        document.querySelector('.kicker-copy').style.clipPath = `inset(0 ${(100 - copyP * 100).toFixed(2)}% 0 0)`;

        // Words.
        for (const w of words) setWord(w.el, t, w.start, w.rot);

        // Highlight word: a single clip wipe reveals both box and copy.
        const boxP = MC.progress(t, 0.76, 0.34, 'outExpo');
        const copyP2 = MC.progress(t, 0.82, 0.28, 'outQuint');
        w4box.style.opacity = String(MC.clamp01(boxP * 1.2));
        w4box.style.transform = `translateY(${((1 - boxP) * 28).toFixed(2)}px)`;
        w4box.style.clipPath = `inset(0 ${(100 - boxP * 100).toFixed(2)}% 0 0)`;
        w4bg.style.transform = 'scaleX(1)';
        document.getElementById('w4').style.opacity = String(MC.clamp01(copyP2));
        document.getElementById('w4').style.transform = `translateY(${((1 - copyP2) * 10).toFixed(2)}px)`;
        const lineP = MC.progress(t, 1.16, 0.3, 'outExpo');
        w4line.style.transform = `scaleX(${lineP.toFixed(3)})`;

        // Icon slots: entry + short beat pulse, plus internal SVG animation.
        iconSlots.forEach((slot, i) => {
          const p = MC.progress(t, iconStarts[i], 0.3, 'outQuint');
          const beat = MC.beat(t, iconStarts[i] + 0.12, 10);
          const pulse = 1 + beat * 0.06;
          slot.style.opacity = String(MC.clamp01(p * 1.2));
          slot.style.transform = `scale(${((0.82 + 0.18 * p) * pulse).toFixed(3)})`;
        });
        iconA.update(t, { exitAt: exitStart });
        iconB.update(t, { exitAt: exitStart });
        iconC.update(t, { exitAt: exitStart });

        // Footer rail and beat counter.
        const footP = MC.progress(t, 0.22, 0.4, 'outCubic');
        footline.style.opacity = String(MC.clamp01(footP));
        footline.style.transform = `translateY(${((1 - footP) * 10).toFixed(2)}px)`;
        footRule.style.transform = `scaleX(${MC.progress(t, 0.26, 0.5, 'outExpo').toFixed(3)})`;
        let beatIndex = 0;
        for (let i = 0; i < beatTimes.length; i++) if (t >= beatTimes[i]) beatIndex = i;
        beatLabel.textContent = `BEAT 0${beatIndex + 1} / 04`;
        beatLabel.style.color = t >= beatTimes[beatIndex] ? '#fbbf24' : '#71717a';

        // Hard end: fully transparent, no residual loop ghost.
        if (ex >= 0.999) stage.style.opacity = '0';
      };

      if (!window.__PUPPETEER_CAPTURE__) {
        const params = new URLSearchParams(window.location.search);
        if (params.get('preview') === '1') {
          let start = null;
          function loop(now) {
            if (!start) start = now;
            const elapsed = (now - start) / 1000;
            window.renderFrame(Math.min(elapsed, DURATION));
            if (elapsed < DURATION) requestAnimationFrame(loop);
          }
          requestAnimationFrame(loop);
        } else {
          window.renderFrame(1.55);
        }
      }
    })();
  </script>
</body>
</html>
