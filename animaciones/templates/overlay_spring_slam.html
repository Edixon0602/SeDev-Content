<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Slam Kinetic Overlay - 3.0s</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    /* PURE 100% TRANSPARENT 1080x1920 CANVAS */
    html, body {
      width: 1080px;
      height: 1920px;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      width: 1040px;
      text-align: center;
      /* Sharp neutral drop shadow for separation against any background - ZERO NEON */
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.95)) drop-shadow(0 3px 6px rgba(0, 0, 0, 1));
    }

    .line {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-size: 88px;
      font-weight: 900;
      letter-spacing: -2px;
      text-transform: uppercase;
      line-height: 1;
      will-change: transform, opacity, filter;
      transform-origin: center center;
    }

    /* LINE 1: ¿ANTHROPIC ✦ */
    .line-1 {
      color: #ff5722; /* Matte vivid Anthropic terracotta */
    }

    .icon-star {
      width: 74px;
      height: 74px;
      fill: #ff5722;
      transform-origin: center center;
    }

    /* LINE 2: VA A PAGAR */
    .line-2 {
      color: #ffffff; /* Matte crisp white */
    }

    /* LINE 3: TU PRÓXIMO SALARIO? 💵 */
    .line-3 {
      color: #ffffff;
    }

    .word-salario {
      color: #00e676; /* Matte cyber emerald - NO NEON HALO */
    }

    .icon-cash {
      width: 76px;
      height: 76px;
      stroke: #00e676;
      stroke-width: 2.8;
      fill: none;
      transform-origin: center center;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Line 1: Enters at 0.0s -->
    <div class="line line-1" id="line1">
      <span>¿ANTHROPIC</span>
      <svg class="icon-star" id="iconStar" viewBox="0 0 24 24">
        <path d="M12 0L14.9 9.1L24 12L14.9 14.9L12 24L9.1 14.9L0 12L9.1 9.1L12 0Z"/>
      </svg>
    </div>

    <!-- Line 2: Enters at 1.0s -->
    <div class="line line-2" id="line2">
      <span>VA A PAGAR</span>
    </div>

    <!-- Line 3: Enters at 2.0s -->
    <div class="line line-3" id="line3">
      <span>TU PRÓXIMO</span>
      <span class="word-salario">SALARIO?</span>
      <svg class="icon-cash" id="iconCash" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2.5"></rect>
        <line x1="2" y1="10" x2="22" y2="10"></line>
        <circle cx="12" cy="14.5" r="2.2" fill="#00e676"></circle>
        <path d="M6 14.5h.01M18 14.5h.01"></path>
      </svg>
    </div>
  </div>

  <script>
    const l1 = document.getElementById('line1');
    const l2 = document.getElementById('line2');
    const l3 = document.getElementById('line3');
    const iconStar = document.getElementById('iconStar');
    const iconCash = document.getElementById('iconCash');

    // Real Damped Spring Physics Function
    // time: elapsed time since trigger
    // omega: frequency (speed of oscillation)
    // zeta: damping ratio (0.5 = bouncy, 0.7 = snappy overshoot)
    function spring(time, omega = 20, zeta = 0.65) {
      if (time <= 0) return 0;
      const decay = Math.exp(-zeta * omega * time);
      const beta = omega * Math.sqrt(1 - zeta * zeta);
      return 1 - decay * (Math.cos(beta * time) + (zeta / Math.sqrt(1 - zeta * zeta)) * Math.sin(beta * time));
    }

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    // EXACT 3.0 SECONDS TOTAL DURATION
    // 0.0s - 1.0s: Line 1 slams in with spring physics and holds
    // 1.0s - 2.0s: Line 2 slams in with spring physics and holds
    // 2.0s - 3.0s: Line 3 slams in with spring physics and holds
    // Single progression. No loop, no cuts.
    window.renderFrame = function(timeInSeconds) {
      const t = clamp(timeInSeconds, 0, 3.0);

      // --- BEAT 1: ¿ANTHROPIC ✦ (0.0s to 1.0s) ---
      if (t < 0.02) {
        l1.style.opacity = '0';
        l1.style.transform = 'scale(1.4) translateY(-40px)';
        iconStar.style.transform = 'scale(0) rotate(-180deg)';
      } else {
        const t1 = t - 0.02;
        const s1 = spring(t1, 18, 0.65); // 0 to ~1 with overshoot
        // Scale slams from 1.4 down to 1.0
        const scaleVal = 1.4 - 0.4 * s1;
        const transY = (1 - clamp(s1, 0, 1)) * -40;
        const rotVal = (1 - clamp(s1, 0, 1)) * -4; // subtle tilt slam

        l1.style.opacity = clamp(t1 * 10, 0, 1);
        l1.style.transform = `translateY(${transY.toFixed(1)}px) scale(${scaleVal.toFixed(3)}) rotate(${rotVal.toFixed(2)}deg)`;

        // Icon spin slam
        const iconScale = clamp(s1, 0, 1.2);
        const iconRot = (1 - clamp(s1, 0, 1)) * -180;
        iconStar.style.transform = `scale(${iconScale.toFixed(2)}) rotate(${iconRot.toFixed(1)}deg)`;
      }

      // --- BEAT 2: VA A PAGAR (1.0s to 2.0s) ---
      if (t < 1.0) {
        l2.style.opacity = '0';
        l2.style.transform = 'scale(1.4) translateY(-40px)';
      } else {
        const t2 = t - 1.0;
        const s2 = spring(t2, 18, 0.65);
        const scaleVal = 1.4 - 0.4 * s2;
        const transY = (1 - clamp(s2, 0, 1)) * -40;
        const rotVal = (1 - clamp(s2, 0, 1)) * 3;

        l2.style.opacity = clamp(t2 * 10, 0, 1);
        l2.style.transform = `translateY(${transY.toFixed(1)}px) scale(${scaleVal.toFixed(3)}) rotate(${rotVal.toFixed(2)}deg)`;
      }

      // --- BEAT 3: TU PRÓXIMO SALARIO? 💵 (2.0s to 3.0s) ---
      if (t < 2.0) {
        l3.style.opacity = '0';
        l3.style.transform = 'scale(1.45) translateY(-40px)';
        iconCash.style.transform = 'scale(0) translateY(-30px)';
      } else {
        const t3 = t - 2.0;
        const s3 = spring(t3, 18, 0.65);
        const scaleVal = 1.45 - 0.45 * s3;
        const transY = (1 - clamp(s3, 0, 1)) * -40;
        const rotVal = (1 - clamp(s3, 0, 1)) * -3;

        l3.style.opacity = clamp(t3 * 10, 0, 1);
        l3.style.transform = `translateY(${transY.toFixed(1)}px) scale(${scaleVal.toFixed(3)}) rotate(${rotVal.toFixed(2)}deg)`;

        // Cash icon bounces in
        const sIcon = spring(Math.max(0, t3 - 0.08), 22, 0.55);
        const iconScale = clamp(sIcon, 0, 1.25);
        const iconY = (1 - clamp(sIcon, 0, 1)) * -30;
        iconCash.style.transform = `translateY(${iconY.toFixed(1)}px) scale(${iconScale.toFixed(2)})`;
      }
    };

    // Browser loop
    let start = null;
    function loop(now) {
      if (!start) start = now;
      const elapsed = (now - start) / 1000;
      window.renderFrame(elapsed % 3.0);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
