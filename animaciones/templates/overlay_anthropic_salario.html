<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay SeDev - Anthropic Salario</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    /* Entire body is 100% TRANSPARENT 1080x1920 */
    body {
      width: 1080px;
      height: 1920px;
      background: transparent;
      overflow: hidden;
      position: relative;
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* Floating Card Container in lower-third (y: 1180px) leaving top 1100px clear for creator face */
    .overlay-card {
      position: absolute;
      left: 70px;
      top: 1200px;
      width: 940px;
      background: rgba(9, 10, 14, 0.92);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 38px 44px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(217, 119, 87, 0.25);
      transform-origin: center bottom;
      will-change: transform, opacity;
      backdrop-filter: blur(20px);
    }

    /* Top Row: Tag & Status Badge */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .badge-anthropic {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(217, 119, 87, 0.12);
      border: 1px solid rgba(217, 119, 87, 0.4);
      padding: 8px 16px;
      border-radius: 100px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 19px;
      font-weight: 700;
      color: #e88668;
      letter-spacing: 0.5px;
    }

    .badge-anthropic svg {
      width: 18px;
      height: 18px;
      fill: #e88668;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 17px;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }

    /* Main Hook Question */
    .headline {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1.5px;
      margin-bottom: 28px;
      color: #ffffff;
    }

    .headline .line1 {
      display: block;
      color: #f1f5f9;
      opacity: 0.95;
    }

    .headline .line2 {
      display: inline-block;
      background: linear-gradient(100deg, #f97316 0%, #e88668 50%, #facc15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      letter-spacing: -1px;
    }

    /* Bottom Row: AI -> Payroll Money Transfer Widget */
    .bottom-widget {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-family: 'JetBrains Mono', monospace;
    }

    .flow-chain {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .flow-node {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 19px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .flow-node.claude {
      border-color: rgba(217, 119, 87, 0.45);
      color: #fca58e;
    }

    .flow-node.salary {
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }

    .flow-arrow {
      display: flex;
      align-items: center;
      color: #64748b;
      font-size: 20px;
      position: relative;
    }

    .flow-arrow svg {
      width: 28px;
      height: 28px;
      stroke: #94a3b8;
    }

    .pulse-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f97316;
      box-shadow: 0 0 8px #f97316;
      top: 11px;
      left: 0px;
    }

    .meta-tag {
      font-size: 16px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    /* Ambient Corner Accent Line */
    .accent-bar {
      position: absolute;
      top: -1.5px;
      left: 40px;
      width: 140px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #e88668, transparent);
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="overlay-card" id="card">
    <div class="accent-bar" id="accentBar"></div>

    <div class="top-row">
      <div class="badge-anthropic">
        <!-- Anthropic Sparkle / Star Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
        </svg>
        ANTHROPIC // UBI
      </div>
      <div class="status-pill">
        <span class="status-dot"></span>
        PROPUESTA OFICIAL
      </div>
    </div>

    <div class="headline">
      <span class="line1" id="line1">¿Anthropic va a pagar</span>
      <span class="line2" id="line2">tu próximo salario?</span>
    </div>

    <div class="bottom-widget">
      <div class="flow-chain">
        <div class="flow-node claude">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm0-8h-2V7h2v2zm4 8h-2v-4h2v4zm0-6h-2V7h2v4z"/>
          </svg>
          MODELOS IA
        </div>
        <div class="flow-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <polyline points="14 6 20 12 14 18"></polyline>
          </svg>
          <div class="pulse-dot" id="pulseDot"></div>
        </div>
        <div class="flow-node salary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="2" y="4" width="20" height="16" rx="3"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
            <circle cx="12" cy="15" r="2"></circle>
          </svg>
          INGRESO BÁSICO
        </div>
      </div>

      <div class="meta-tag">DEBATE 2026</div>
    </div>
  </div>

  <script>
    const card = document.getElementById('card');
    const line1 = document.getElementById('line1');
    const line2 = document.getElementById('line2');
    const pulseDot = document.getElementById('pulseDot');
    const accentBar = document.getElementById('accentBar');

    // Easing helpers
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    function easeInOutQuad(x) {
      return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    }

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    // Deterministic frame render function (0.0s to 4.5s cycle)
    window.renderFrame = function(time) {
      const DURATION = 4.5;
      const t = time % DURATION;

      // 1. CARD ENTRANCE (0.0s to 0.45s) & EXIT (3.9s to 4.5s)
      let scale = 1;
      let translateY = 0;
      let opacity = 1;

      if (t < 0.45) {
        const prog = t / 0.45;
        const eased = easeOutBack(prog);
        scale = 0.88 + 0.12 * eased;
        translateY = 60 * (1 - prog);
        opacity = clamp(prog * 2.5, 0, 1);
      } else if (t > 3.9) {
        const prog = (t - 3.9) / 0.6;
        translateY = 50 * prog;
        scale = 1 - 0.05 * prog;
        opacity = clamp(1 - prog * 1.5, 0, 1);
      } else {
        // Subtle floating breathing effect during hold
        translateY = Math.sin((t - 0.45) * 3) * 3;
        scale = 1;
        opacity = 1;
      }

      card.style.transform = `translateY(${translateY.toFixed(2)}px) scale(${scale.toFixed(4)})`;
      card.style.opacity = opacity.toFixed(3);

      // 2. TEXT REVEAL (Line 1: 0.15s - 0.45s, Line 2: 0.35s - 0.70s)
      const p1 = clamp((t - 0.15) / 0.3, 0, 1);
      line1.style.opacity = p1;
      line1.style.transform = `translateY(${(15 * (1 - p1)).toFixed(2)}px)`;

      const p2 = clamp((t - 0.35) / 0.35, 0, 1);
      line2.style.opacity = p2;
      line2.style.transform = `translateY(${(20 * (1 - p2)).toFixed(2)}px)`;

      // 3. TRANSFER PULSE DOT MOVING ACROSS ARROW (0.8s to 3.8s, looping)
      if (t >= 0.7 && t < 3.9) {
        const arrowTime = (t - 0.7) % 1.2;
        const arrowProg = arrowTime / 1.2;
        const posX = arrowProg * 24; // moves 0px to 24px across the arrow
        pulseDot.style.opacity = (arrowProg > 0.1 && arrowProg < 0.9) ? '1' : '0';
        pulseDot.style.transform = `translateX(${posX.toFixed(2)}px)`;
      } else {
        pulseDot.style.opacity = '0';
      }

      // 4. ACCENT BAR SHIMMER (sweeps left to right)
      const barProg = (t % 2.5) / 2.5;
      const barX = 40 + barProg * 700;
      accentBar.style.left = `${barX.toFixed(1)}px`;
    };

    // Live preview loop for opening directly in browser
    let start = null;
    function loop(now) {
      if (!start) start = now;
      window.renderFrame((now - start) / 1000);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
