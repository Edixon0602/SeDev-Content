<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay SeDev - Ingreso Básico Universal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      width: 1000px;
      will-change: transform;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      min-height: 110px;
    }

    /* Core typography: crisp 8px contour, ZERO blurry smudge */
    .word {
      position: relative;
      display: inline-flex;
      align-items: center;
      font-size: 88px;
      font-weight: 900;
      letter-spacing: -2.5px;
      text-transform: uppercase;
      line-height: 1.05;
      color: #ffffff;
      paint-order: stroke fill;
      -webkit-text-stroke: 8px #09090b;
      filter: drop-shadow(0 6px 0px #09090b);
      transform-origin: center center;
      will-change: transform, opacity;
      opacity: 0;
    }

    /* Color variations */
    .word-ingreso {
      color: #ffffff;
    }

    .word-basico {
      color: #fbbf24;
    }

    .word-universal {
      color: #38bdf8;
    }

    /* Animated Icon Containers - crisp vector borders, ZERO blurry smudge */
    .icon-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transform-origin: center center;
      will-change: transform, opacity;
      opacity: 0;
      filter: drop-shadow(0 6px 0px #09090b);
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <!-- ROW 1: [Icon Inflow] INGRESO -->
    <div class="row" id="row1">
      <div class="icon-box" id="iconInflow">
        <svg viewBox="0 0 82 82" width="82" height="82">
          <rect x="6" y="6" width="70" height="70" rx="20" fill="#18181b" stroke="#09090b" stroke-width="5"/>
          <rect x="10" y="10" width="62" height="62" rx="16" fill="none" stroke="#10b981" stroke-width="2.5"/>
          <!-- Vault slot line -->
          <line x1="22" y1="56" x2="60" y2="56" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
          <!-- Inflow animated arrow -->
          <g id="inflowArrow" style="transform-origin: 41px 36px;">
            <path d="M41 20 V46 M30 36 L41 47 L52 36" fill="none" stroke="#10b981" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>
      <span class="word word-ingreso" id="wIngreso">Ingreso</span>
    </div>

    <!-- ROW 2: BÁSICO [Icon Baseline] -->
    <div class="row" id="row2">
      <span class="word word-basico" id="wBasico">Básico</span>
      <div class="icon-box" id="iconBaseline">
        <svg viewBox="0 0 82 82" width="82" height="82">
          <circle cx="41" cy="41" r="35" fill="#18181b" stroke="#09090b" stroke-width="5"/>
          <circle cx="41" cy="41" r="31" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
          <!-- Base floor line -->
          <line x1="20" y1="56" x2="62" y2="56" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
          <!-- Fulcrum triangle -->
          <polygon points="41,43 35,55 47,55" fill="#09090b" stroke="#fbbf24" stroke-width="2"/>
          <!-- Dynamic balance beam -->
          <g id="balanceBeam" style="transform-origin: 41px 41px;">
            <line x1="20" y1="41" x2="62" y2="41" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
            <circle cx="22" cy="35" r="4" fill="#fbbf24" stroke="#09090b" stroke-width="2"/>
            <circle cx="60" cy="35" r="4" fill="#fbbf24" stroke="#09090b" stroke-width="2"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- ROW 3: [Icon Globe] UNIVERSAL -->
    <div class="row" id="row3">
      <div class="icon-box" id="iconGlobe">
        <svg viewBox="0 0 82 82" width="82" height="82">
          <rect x="6" y="6" width="70" height="70" rx="20" fill="#18181b" stroke="#09090b" stroke-width="5"/>
          <rect x="10" y="10" width="62" height="62" rx="16" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
          <!-- Globe outline -->
          <circle cx="41" cy="41" r="23" fill="#09090b" stroke="#38bdf8" stroke-width="3"/>
          <line x1="18" y1="41" x2="64" y2="41" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2"/>
          <!-- Meridian oscillating in 3D -->
          <ellipse id="meridian" cx="41" cy="41" rx="14" ry="23" fill="none" stroke="#ffffff" stroke-width="2.2"/>
          <!-- Orbit ring with satellite -->
          <g id="orbitGroup" style="transform-origin: 41px 41px;">
            <ellipse cx="41" cy="41" rx="29" ry="10" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 3" transform="rotate(-25 41 41)"/>
            <circle id="satellite" cx="66" cy="30" r="4.5" fill="#ffffff" stroke="#09090b" stroke-width="2"/>
          </g>
        </svg>
      </div>
      <span class="word word-universal" id="wUniversal">Universal</span>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const iconInflow = document.getElementById('iconInflow');
    const wIngreso = document.getElementById('wIngreso');
    const wBasico = document.getElementById('wBasico');
    const iconBaseline = document.getElementById('iconBaseline');
    const iconGlobe = document.getElementById('iconGlobe');
    const wUniversal = document.getElementById('wUniversal');

    const inflowArrow = document.getElementById('inflowArrow');
    const balanceBeam = document.getElementById('balanceBeam');
    const meridian = document.getElementById('meridian');
    const orbitGroup = document.getElementById('orbitGroup');
    const satellite = document.getElementById('satellite');

    // Damped spring physics
    function spring(dt, omega = 24, zeta = 0.65) {
      if (dt <= 0) return 0;
      const decay = Math.exp(-zeta * omega * dt);
      const beta = omega * Math.sqrt(1 - zeta * zeta);
      return 1 - decay * (Math.cos(beta * dt) + (zeta / Math.sqrt(1 - zeta * zeta)) * Math.sin(beta * dt));
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    window.renderFrame = function(timeInSeconds) {
      const t = clamp(timeInSeconds, 0, 3.0);

      // --- EXIT PHASE (t > 2.65s) ---
      let exitY = 0;
      let exitOpacity = 1;
      if (t > 2.65) {
        const exitProgress = (t - 2.65) / 0.35; // 0 -> 1
        const ease = exitProgress * exitProgress;
        exitY = -ease * 90;
        exitOpacity = clamp(1 - exitProgress * 1.3, 0, 1);
      }

      // --- ROW 1: INGRESO (t >= 0.12s) - Directional slide from left ---
      const dtInflow = t - 0.12;
      if (dtInflow < 0) {
        iconInflow.style.opacity = '0';
        iconInflow.style.transform = 'translateX(-60px) scale(0.6)';
      } else {
        const s = spring(dtInflow, 26, 0.65);
        const op = clamp(dtInflow / 0.08, 0, 1) * exitOpacity;
        const tx = (1 - s) * -60;
        const scale = 0.6 + 0.4 * s;
        iconInflow.style.opacity = op.toFixed(3);
        iconInflow.style.transform = `translateX(${tx.toFixed(1)}px) scale(${scale.toFixed(3)})`;
      }

      const dtIngreso = t - 0.22;
      if (dtIngreso < 0) {
        wIngreso.style.opacity = '0';
        wIngreso.style.transform = 'translateX(-70px) scale(0.7) rotate(-4deg)';
      } else {
        const s = spring(dtIngreso, 24, 0.62);
        const op = clamp(dtIngreso / 0.08, 0, 1) * exitOpacity;
        const tx = (1 - s) * -70;
        const scale = 0.7 + 0.3 * s;
        const rot = (1 - s) * -4;
        wIngreso.style.opacity = op.toFixed(3);
        wIngreso.style.transform = `translateX(${tx.toFixed(1)}px) scale(${scale.toFixed(3)}) rotate(${rot.toFixed(2)}deg)`;
      }

      // --- ROW 2: BÁSICO (t >= 0.85s) - Slam impact from above ---
      const dtBasico = t - 0.85;
      if (dtBasico < 0) {
        wBasico.style.opacity = '0';
        wBasico.style.transform = 'translateY(-45px) scale(1.3)';
      } else {
        const s = spring(dtBasico, 25, 0.64);
        const op = clamp(dtBasico / 0.07, 0, 1) * exitOpacity;
        const ty = (1 - s) * -45;
        const scale = 1.3 - 0.3 * s;
        wBasico.style.opacity = op.toFixed(3);
        wBasico.style.transform = `translateY(${ty.toFixed(1)}px) scale(${scale.toFixed(3)})`;
      }

      const dtBaseline = t - 0.95;
      if (dtBaseline < 0) {
        iconBaseline.style.opacity = '0';
        iconBaseline.style.transform = 'scale(0.5) rotate(45deg)';
      } else {
        const s = spring(dtBaseline, 26, 0.65);
        const op = clamp(dtBaseline / 0.08, 0, 1) * exitOpacity;
        const scale = 0.5 + 0.5 * s;
        const rot = (1 - s) * 45;
        iconBaseline.style.opacity = op.toFixed(3);
        iconBaseline.style.transform = `scale(${scale.toFixed(3)}) rotate(${rot.toFixed(2)}deg)`;
      }

      // --- ROW 3: UNIVERSAL (t >= 1.55s) - Directional slide from right ---
      const dtGlobe = t - 1.55;
      if (dtGlobe < 0) {
        iconGlobe.style.opacity = '0';
        iconGlobe.style.transform = 'scale(0.5) rotate(-30deg)';
      } else {
        const s = spring(dtGlobe, 26, 0.65);
        const op = clamp(dtGlobe / 0.08, 0, 1) * exitOpacity;
        const scale = 0.5 + 0.5 * s;
        const rot = (1 - s) * -30;
        iconGlobe.style.opacity = op.toFixed(3);
        iconGlobe.style.transform = `scale(${scale.toFixed(3)}) rotate(${rot.toFixed(2)}deg)`;
      }

      const dtUniversal = t - 1.65;
      if (dtUniversal < 0) {
        wUniversal.style.opacity = '0';
        wUniversal.style.transform = 'translateX(70px) scale(0.7) rotate(4deg)';
      } else {
        const s = spring(dtUniversal, 24, 0.62);
        const op = clamp(dtUniversal / 0.08, 0, 1) * exitOpacity;
        const tx = (1 - s) * 70;
        const scale = 0.7 + 0.3 * s;
        const rot = (1 - s) * 4;
        wUniversal.style.opacity = op.toFixed(3);
        wUniversal.style.transform = `translateX(${tx.toFixed(1)}px) scale(${scale.toFixed(3)}) rotate(${rot.toFixed(2)}deg)`;
      }

      // --- SECONDARY MICRO-ANIMATIONS (Icons alive throughout) ---
      // 1. Inflow Arrow: continuous downward recurring deposit pulse
      const arrowPhase = Math.max(0, t - 0.12);
      const arrowY = (Math.sin(arrowPhase * 8) * 4);
      inflowArrow.style.transform = `translateY(${arrowY.toFixed(1)}px)`;

      // 2. Baseline Beam: dynamic balance tilt settling into perfect horizontal level
      const beamPhase = Math.max(0, t - 0.85);
      const beamTilt = Math.sin(beamPhase * 9) * Math.exp(-beamPhase * 2.5) * 8;
      balanceBeam.style.transform = `rotate(${beamTilt.toFixed(2)}deg)`;

      // 3. Globe Meridian & Satellite: 3D rotation & orbit
      const globePhase = Math.max(0, t - 1.55);
      // Oscillate meridian rx between 1 and 22 to simulate spinning sphere
      const meridianWidth = Math.max(1.5, Math.abs(Math.cos(globePhase * 3.5)) * 20);
      meridian.setAttribute('rx', meridianWidth.toFixed(1));

      // Satellite revolving in elliptical orbit
      const orbitAngle = globePhase * 4.2;
      const satX = 41 + Math.cos(orbitAngle) * 26;
      const satY = 41 + Math.sin(orbitAngle) * 8 - Math.cos(orbitAngle) * 4; // slight tilt
      satellite.setAttribute('cx', satX.toFixed(1));
      satellite.setAttribute('cy', satY.toFixed(1));

      // --- STAGE ORGANIC FLOAT & EXIT ---
      const breath = t >= 0.22 ? Math.sin(t * 3.2) * 2.5 : 0;
      stage.style.transform = `translateY(${(exitY + breath).toFixed(1)}px)`;
    };

    // Preview loop for direct double-click in browser
    if (!window.__PUPPETEER_CAPTURE__) {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('preview') === '1') {
        let start = null;
        function loop(now) {
          if (!start) start = now;
          const elapsed = (now - start) / 1000;
          window.renderFrame(Math.min(elapsed, 3.0));
          if (elapsed < 3.0) requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      } else {
        // Show settled lockup state when inspected statically
        window.renderFrame(2.4);
      }
    }
  </script>
</body>
</html>
