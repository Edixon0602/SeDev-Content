<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SeDev 60s Video Player & Teleprompter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #09090b;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Left Control Sidebar */
    .sidebar {
      width: 380px;
      background: #101014;
      border-right: 1.5px solid #27272a;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .brand {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .manifest-info {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .manifest-title {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
    }
    .manifest-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #a1a1aa;
    }

    .load-btn {
      background: #27272a;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .load-btn:hover { background: #3f3f46; color: #ffffff; }

    .scene-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .scene-item {
      background: #18181b;
      border: 1.5px solid #27272a;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }
    .scene-item:hover {
      border-color: #3f3f46;
      background: #202024;
    }
    .scene-item.active {
      border-color: #fbbf24;
      background: #1e1b12;
    }
    .scene-name {
      font-size: 12px;
      font-weight: 800;
      color: #e4e4e7;
    }
    .scene-dur {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #a1a1aa;
      background: #09090b;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Main Preview Viewport */
    .viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #050505;
      position: relative;
    }

    .stage-wrapper {
      height: 82vh;
      aspect-ratio: 9 / 16;
      background: #050505;
      border: 2px solid #27272a;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Virtual 1080x1920 Stage */
    #stageScaler {
      width: 1080px;
      height: 1920px;
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
    }

    #stage {
      width: 1080px;
      height: 1920px;
      background: #050505;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Bottom Floating Playback Bar & Teleprompter */
    .playback-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      background: rgba(14, 14, 18, 0.96);
      backdrop-filter: blur(16px);
      border: 1.5px solid #27272a;
      border-radius: 18px;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.95);
      z-index: 100;
    }

    .teleprompter-box {
      background: #09090c;
      border: 1px solid #27272a;
      border-left: 4px solid #fbbf24;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .tp-cue {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .tp-text {
      font-size: 15px;
      font-weight: 700;
      color: #f4f4f5;
      line-height: 1.35;
    }

    .bar-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .play-btn {
      background: #ffffff;
      color: #09090b;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s ease;
    }
    .play-btn:active { transform: scale(0.96); }

    .time-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #fbbf24;
    }

    .scrubber {
      width: 100%;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: #27272a;
      outline: none;
      cursor: pointer;
    }
    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fbbf24;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }

    /* Minimalist Monospace Header (Zero AI-Slop, NO PILLS, NO BORDERS) */
    .scene-category {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #71717a;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* 1. Kinetic Hook Styling */
    .comp-kinetic-hook {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 960px;
    }
    .kh-icon-wrap {
      margin-bottom: 30px;
      filter: drop-shadow(0 6px 0px #09090b);
    }
    .kh-lines {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }
    .kh-line {
      font-size: 84px;
      font-weight: 900;
      letter-spacing: -2.5px;
      line-height: 1.05;
      text-transform: uppercase;
      paint-order: stroke fill;
      -webkit-text-stroke: 8px #09090b;
      filter: drop-shadow(0 6px 0px #09090b);
    }
    .kh-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      color: #71717a;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* 2. Architecture Flow Styling */
    .comp-arch-flow {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 960px;
    }

    /* 3. Code Terminal Styling */
    .comp-code-terminal {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 940px;
    }
    .ct-window {
      width: 100%;
      background: #0d0d11;
      border: 1.5px solid #27272a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.8);
      margin-bottom: 26px;
    }
    .ct-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      background: #141418;
      border-bottom: 1.5px solid #27272a;
    }
    .ct-dots { display: flex; gap: 8px; }
    .ct-dots .dot { width: 13px; height: 13px; border-radius: 50%; }
    .ct-dots .red { background: #ef4444; }
    .ct-dots .yellow { background: #f59e0b; }
    .ct-dots .green { background: #10b981; }
    .ct-filename {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: #d4d4d8;
      font-weight: 600;
    }
    .ct-lang {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #71717a;
      font-weight: 700;
    }
    .ct-editor {
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 21px;
      line-height: 1.4;
    }
    .ct-line { display: flex; gap: 20px; }
    .ct-line.highlight {
      background: rgba(251, 191, 36, 0.12);
      border-left: 3px solid #fbbf24;
      padding-left: 8px;
      margin-left: -11px;
    }
    .ct-linenum {
      color: #3f3f46;
      user-select: none;
      font-size: 17px;
      width: 28px;
    }
    .ct-linetext .kw { color: #f43f5e; font-weight: 700; }
    .ct-linetext .fn { color: #38bdf8; font-weight: 600; }
    .ct-linetext .str { color: #34d399; }
    .ct-linetext .comm { color: #52525b; font-style: italic; }

    .ct-terminal {
      width: 100%;
      background: #09090b;
      border: 1.5px solid #27272a;
      border-radius: 14px;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
    }
    .term-bar {
      display: flex;
      justify-content: space-between;
      padding: 10px 18px;
      background: #121215;
      border-bottom: 1px solid #27272a;
      font-size: 13px;
      color: #71717a;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .term-body {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .term-cmd { display: flex; gap: 12px; font-size: 18px; color: #ffffff; }
    .term-cmd .prompt { color: #10b981; font-weight: 700; }
    .term-out {
      font-size: 16px;
      color: #a1a1aa;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    /* 4. Metrics Comparison Styling */
    .comp-metrics-comp {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 940px;
    }
    .mc-title {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 36px;
      text-transform: uppercase;
      color: #ffffff;
    }
    .mc-cards {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
      margin-bottom: 34px;
    }
    .mc-card {
      background: #0d0d11;
      border: 1.5px solid #27272a;
      border-radius: 16px;
      padding: 26px 30px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .mc-card.winner {
      border-color: #10b981;
      background: #081a13;
    }
    .mc-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mc-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #d4d4d8;
    }
    .mc-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      background: #27272a;
      color: #a1a1aa;
    }
    .mc-tag.green {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .mc-num {
      font-size: 58px;
      font-weight: 900;
      letter-spacing: -1.5px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .mc-bar-track {
      width: 100%;
      height: 12px;
      background: #18181b;
      border-radius: 6px;
      overflow: hidden;
    }
    .mc-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.05s linear;
    }
    .mc-delta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 36px;
      border-radius: 8px;
      background: #10b981;
      border: 3px solid #09090b;
      box-shadow: 0 6px 0px #09090b;
      color: #052e16;
    }
    .mc-delta-text {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    /* 5. Memory Layout Styling */
    .comp-memory-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 960px;
    }
    .ml-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 30px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .ml-table {
      width: 100%;
      background: #0d0d11;
      border: 1.5px solid #27272a;
      border-radius: 16px;
      padding: 18px 24px;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 28px;
    }
    .ml-table-head {
      display: flex;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
      color: #71717a;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .ml-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #18181b;
      font-size: 17px;
    }
    .ml-row:last-child { border-bottom: none; }
    .ml-addr {
      color: #38bdf8;
      font-weight: 700;
      width: 140px;
    }
    .ml-bytes { display: flex; gap: 10px; }
    .ml-bytes .byte {
      color: #d4d4d8;
      background: #18181b;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 16px;
    }
    .ml-bytes .byte.lead {
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
      font-weight: 700;
    }
    .ml-label {
      color: #a1a1aa;
      font-size: 15px;
      font-weight: 600;
      width: 220px;
      text-align: right;
    }
    .ml-latency {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
    }
    .lat-box {
      flex: 1;
      background: #0d0d11;
      border: 1.5px solid #27272a;
      border-radius: 14px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .lat-box.ram { border-color: #10b981; }
    .lat-box.nvme { border-color: #ef4444; }
    .lat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #71717a;
      letter-spacing: 1px;
    }
    .lat-val {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -1px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .lat-box.ram .lat-val { color: #10b981; }
    .lat-box.nvme .lat-val { color: #ef4444; }
    .lat-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #a1a1aa;
      font-weight: 600;
    }
    .lat-vs {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 900;
      color: #52525b;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      SEDEV 60S ENGINE
    </div>

    <div class="manifest-info">
      <div class="manifest-title" id="mTitle">Cargando manifiesto...</div>
      <div class="manifest-meta" id="mMeta">0 escenas // 0.0s total</div>
    </div>

    <button class="load-btn" onclick="document.getElementById('filePicker').click()">
      📂 Cargar otro JSON de Manifiesto
    </button>
    <input type="file" id="filePicker" accept=".json" style="display:none;" onchange="handleFileSelect(event)">

    <div style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #71717a; text-transform: uppercase;">ESCENAS DEL VÍDEO</div>
    <div class="scene-list" id="sceneList"></div>
  </div>

  <!-- Viewport -->
  <div class="viewport">
    <div class="stage-wrapper" id="stageWrapper">
      <div id="stageScaler">
        <div id="stage"></div>
      </div>
    </div>

    <!-- Playback Bar -->
    <div class="playback-bar">
      <!-- Live Teleprompter Cue -->
      <div class="teleprompter-box" id="teleprompterBox">
        <div class="tp-cue" id="tpCue">Cargando guion...</div>
        <div class="tp-text" id="tpText">Locución...</div>
      </div>

      <div class="bar-controls">
        <button class="play-btn" id="playBtn">▶ REPRODUCIR</button>
        <span class="time-display" id="timeDisplay">00.0s / 60.0s</span>
      </div>
      <input type="range" class="scrubber" id="scrubber" min="0" max="60" step="0.033" value="0">
    </div>
  </div>

  <!-- Component Registry Definition -->
  <script>
    window.__COMPONENTS__ = {};
    window.registerComponent = function(name, def) {
      window.__COMPONENTS__[name] = def;
    };
  </script>

  <!-- Component Scripts & Icons -->
  <script src="templates/components/icons_sedev.js"></script>
  <script src="templates/components/kinetic_hook.js"></script>
  <script src="templates/components/architecture_flow.js"></script>
  <script src="templates/components/code_terminal.js"></script>
  <script src="templates/components/metrics_comparison.js"></script>
  <script src="templates/components/memory_layout.js"></script>
  <script src="templates/components/tree_hierarchy.js"></script>
  <script src="templates/components/network_pipeline.js"></script>
  <script src="templates/components/latency_scale.js"></script>
  <script src="templates/components/tradeoff_matrix.js"></script>
  <script src="templates/components/terminal_split.js"></script>

  <!-- Default Manifest Script (Zero CORS on file://) -->
  <script src="manifests/ejemplo_redis_60s.js"></script>

  <script>
    // Math Utilities
    const utils = {
      spring(dt, omega = 24, zeta = 0.65) {
        if (dt <= 0) return 0;
        const decay = Math.exp(-zeta * omega * dt);
        const beta = omega * Math.sqrt(1 - zeta * zeta);
        return 1 - decay * (Math.cos(beta * dt) + (zeta / Math.sqrt(1 - zeta * zeta)) * Math.sin(beta * dt));
      },
      clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      },
      lerp(a, b, t) {
        return a + (b - a) * t;
      }
    };

    let manifest = null;
    let totalDuration = 60.0;
    let currentTime = 0;
    let isPlaying = false;
    let lastTimestamp = null;
    let activeSceneIndex = -1;
    let currentScene = null;
    let currentComponent = null;

    const stageEl = document.getElementById('stage');
    const stageScaler = document.getElementById('stageScaler');
    const stageWrapper = document.getElementById('stageWrapper');
    const playBtn = document.getElementById('playBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const scrubber = document.getElementById('scrubber');
    const mTitle = document.getElementById('mTitle');
    const mMeta = document.getElementById('mMeta');
    const sceneList = document.getElementById('sceneList');
    const tpCue = document.getElementById('tpCue');
    const tpText = document.getElementById('tpText');

    // Auto-scale stage to fit stageWrapper cleanly
    function resizeStage() {
      const wrapperHeight = stageWrapper.clientHeight;
      const scale = wrapperHeight / 1920;
      stageScaler.style.transform = `scale(${scale})`;
      stageWrapper.style.width = `${1080 * scale}px`;
    }
    window.addEventListener('resize', resizeStage);

    function loadManifestData(data) {
      manifest = data;
      totalDuration = manifest.scenes.reduce((acc, s) => acc + (s.duration || 5.0), 0);
      mTitle.innerText = manifest.title;
      mMeta.innerText = `${manifest.scenes.length} escenas // ${totalDuration.toFixed(1)}s total @ ${manifest.fps || 30}fps`;
      scrubber.max = totalDuration;

      // Populate Scenes list
      sceneList.innerHTML = '';
      manifest.scenes.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = 'scene-item';
        item.id = `sItem_${idx}`;
        item.innerHTML = `
          <div>
            <div class="scene-name">${idx + 1}. ${s.type}</div>
            <div style="font-size:11px; color:#71717a;">${s.id}</div>
          </div>
          <span class="scene-dur">${s.duration.toFixed(1)}s</span>
        `;
        item.onclick = () => jumpToScene(idx);
        sceneList.appendChild(item);
      });

      activeSceneIndex = -1;
      resizeStage();
      seek(0);
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          loadManifestData(data);
        } catch (err) {
          alert('Error leyendo JSON: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    function loadScene(sceneData) {
      currentScene = sceneData;
      stageEl.innerHTML = '';
      const compDef = window.__COMPONENTS__[sceneData.type];
      if (!compDef) {
        stageEl.innerHTML = `<div style="color:red; font-size:32px;">Component not found: ${sceneData.type}</div>`;
        return;
      }
      currentComponent = compDef;
      if (typeof compDef.init === 'function') {
        compDef.init(stageEl, sceneData.props || {});
      }
    }

    function renderFrame(timeInSeconds) {
      if (!currentScene || !currentComponent) return;
      const duration = currentScene.duration || 5.0;
      const t = utils.clamp(timeInSeconds, 0, duration);

      // Subtle dynamic camera push-in
      const camPush = 1.0 + (t / duration) * 0.035;
      stageEl.style.transform = `scale(${camPush.toFixed(4)})`;

      currentComponent.render(stageEl, t, duration, currentScene.props || {}, utils);
    }

    function getSceneAtTime(time) {
      let accumulated = 0;
      for (let i = 0; i < manifest.scenes.length; i++) {
        const s = manifest.scenes[i];
        if (time >= accumulated && time < accumulated + s.duration) {
          return { index: i, scene: s, sceneTime: time - accumulated };
        }
        accumulated += s.duration;
      }
      const lastIdx = manifest.scenes.length - 1;
      return { index: lastIdx, scene: manifest.scenes[lastIdx], sceneTime: manifest.scenes[lastIdx].duration };
    }

    function jumpToScene(targetIdx) {
      let accumulated = 0;
      for (let i = 0; i < targetIdx; i++) {
        accumulated += manifest.scenes[i].duration;
      }
      seek(accumulated + 0.05);
    }

    function seek(time) {
      currentTime = Math.max(0, Math.min(time, totalDuration));
      scrubber.value = currentTime;
      timeDisplay.innerText = `${currentTime.toFixed(1).padStart(4, '0')}s / ${totalDuration.toFixed(1)}s`;

      const info = getSceneAtTime(currentTime);
      if (info.index !== activeSceneIndex) {
        activeSceneIndex = info.index;
        // Update sidebar highlights
        document.querySelectorAll('.scene-item').forEach(el => el.classList.remove('active'));
        const activeEl = document.getElementById(`sItem_${activeSceneIndex}`);
        if (activeEl) activeEl.classList.add('active');

        // Load new scene
        loadScene(info.scene);
      }

      // Render exact frame timestamp
      renderFrame(info.sceneTime);

      // Update live teleprompter display
      if (info.scene) {
        tpCue.innerText = `[${info.index + 1}/${manifest.scenes.length}] ACCIÓN: ${info.scene.visual_cue || info.scene.id}`;
        tpText.innerText = info.scene.voiceover ? `"${info.scene.voiceover}"` : '(Sin locución asignada)';
      }
    }

    // Playback loop
    function loop(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      currentTime += dt;
      if (currentTime >= totalDuration) {
        currentTime = 0;
        seek(0);
        isPlaying = false;
        playBtn.innerText = '▶ REPRODUCIR';
      } else {
        seek(currentTime);
        requestAnimationFrame(loop);
      }
    }

    playBtn.onclick = () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playBtn.innerText = '⏸ PAUSAR';
        lastTimestamp = null;
        requestAnimationFrame(loop);
      } else {
        playBtn.innerText = '▶ REPRODUCIR';
      }
    };

    scrubber.oninput = (e) => {
      if (isPlaying) {
        isPlaying = false;
        playBtn.innerText = '▶ REPRODUCIR';
      }
      seek(parseFloat(e.target.value));
    };

    // Bootstrap: check window.__DEFAULT_MANIFEST__ first, or fallback to fetch
    if (window.__DEFAULT_MANIFEST__) {
      loadManifestData(window.__DEFAULT_MANIFEST__);
    } else {
      fetch('manifests/ejemplo_redis_60s.json')
        .then(r => r.json())
        .then(data => loadManifestData(data))
        .catch(err => {
          mTitle.innerText = 'Selecciona un archivo JSON abajo';
          mMeta.innerText = 'Usa el botón "Cargar otro JSON"';
        });
    }
  </script>
</body>
</html>
