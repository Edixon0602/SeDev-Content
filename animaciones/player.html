<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SeDev 60s Video Player & Teleprompter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #09090b;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Left Control Sidebar */
    .sidebar {
      width: 380px;
      background: #101014;
      border-right: 1.5px solid #27272a;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .brand {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .manifest-info {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .manifest-title {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
    }
    .manifest-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #a1a1aa;
    }

    /* Video Catalog Dropdown & Quick Selector */
    .video-selector-wrap {
      background: #141418;
      border: 1.5px solid #27272a;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .catalog-dropdown {
      width: 100%;
      background: #1c1c22;
      color: #ffffff;
      border: 1.5px solid #3f3f46;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .catalog-dropdown:focus, .catalog-dropdown:hover {
      border-color: #38bdf8;
    }
    .catalog-dropdown optgroup {
      background: #121216;
      color: #fbbf24;
      font-weight: 800;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
    }
    .catalog-dropdown option {
      background: #1c1c22;
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      padding: 6px;
    }

    .catalog-nav-row {
      display: flex;
      gap: 6px;
    }
    .nav-btn {
      flex: 1;
      background: #27272a;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .nav-btn:hover {
      background: #38bdf8;
      color: #09090b;
      border-color: #38bdf8;
    }
    .nav-btn.toggle-var {
      background: #292312;
      color: #fbbf24;
      border-color: #785a18;
    }
    .nav-btn.toggle-var:hover {
      background: #fbbf24;
      color: #09090b;
      border-color: #fbbf24;
    }

    .badge-category {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #38bdf8;
      background: #0c2434;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid #0369a1;
      text-transform: uppercase;
    }
    .badge-var {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      color: #fbbf24;
      background: #2e230a;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid #854d0e;
    }

    .load-btn {
      background: #27272a;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .load-btn:hover { background: #3f3f46; color: #ffffff; }

    .scene-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .scene-item {
      background: #18181b;
      border: 1.5px solid #27272a;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }
    .scene-item:hover {
      border-color: #3f3f46;
      background: #202024;
    }
    .scene-item.active {
      border-color: #fbbf24;
      background: #1e1b12;
    }
    .scene-name {
      font-size: 12px;
      font-weight: 800;
      color: #e4e4e7;
    }
    .scene-dur {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #a1a1aa;
      background: #09090b;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Main Preview Viewport */
    .viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #050505;
      position: relative;
    }

    .stage-wrapper {
      height: 82vh;
      aspect-ratio: 9 / 16;
      background: #050505;
      border: 2px solid #27272a;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Virtual 1080x1920 Stage */
    #stageScaler {
      width: 1080px;
      height: 1920px;
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
    }

    #stage {
      width: 1080px;
      height: 1920px;
      background: #050505;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Bottom Floating Playback Bar & Teleprompter */
    .playback-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      background: rgba(14, 14, 18, 0.96);
      backdrop-filter: blur(16px);
      border: 1.5px solid #27272a;
      border-radius: 18px;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.95);
      z-index: 100;
    }

    .teleprompter-box {
      background: #09090c;
      border: 1px solid #27272a;
      border-left: 4px solid #fbbf24;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .tp-cue {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .tp-text {
      font-size: 15px;
      font-weight: 700;
      color: #f4f4f5;
      line-height: 1.35;
    }

    .bar-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .play-btn {
      background: #ffffff;
      color: #09090b;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s ease;
    }
    .play-btn:active { transform: scale(0.96); }

    .time-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #fbbf24;
    }

    .scrubber {
      width: 100%;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: #27272a;
      outline: none;
      cursor: pointer;
    }
    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fbbf24;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }

    /* Minimalist Monospace Header (Zero AI-Slop, NO PILLS, NO BORDERS) */
    .scene-category {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #71717a;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* 1. Kinetic Hook Styling */
    .comp-kinetic-hook {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 960px;
    }
    .kh-icon-wrap {
      margin-bottom: 30px;
      filter: drop-shadow(0 6px 0px #09090b);
    }
    .kh-lines {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }
    .kh-line {
      font-size: 84px;
      font-weight: 900;
      letter-spacing: -2.5px;
      line-height: 1.05;
      text-transform: uppercase;
      paint-order: stroke fill;
      -webkit-text-stroke: 8px #09090b;
      filter: drop-shadow(0 6px 0px #09090b);
    }
    .kh-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      color: #71717a;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* 2. Architecture Flow Styling */
    .comp-arch-flow {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 960px;
    }

    /* 3. Code Terminal Styling */
    .comp-code-terminal {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 940px;
    }
    .ct-window {
      width: 100%;
      background: #0d0d11;
      border: 1.5px solid #27272a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.8);
      margin-bottom: 26px;
    }
    .ct-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      background: #141418;
      border-bottom: 1.5px solid #27272a;
    }
    .ct-dots { display: flex; gap: 8px; }
    .ct-dots .dot { width: 13px; height: 13px; border-radius: 50%; }
    .ct-dots .red { background: #ef4444; }
    .ct-dots .yellow { background: #f59e0b; }
    .ct-dots .green { background: #10b981; }
    .ct-filename {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: #d4d4d8;
      font-weight: 600;
    }
    .ct-lang {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #71717a;
      font-weight: 700;
    }
    .ct-editor {
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 21px;
      line-height: 1.4;
    }
    .ct-line { display: flex; gap: 20px; }
    .ct-line.highlight {
      background: rgba(251, 191, 36, 0.12);
      border-left: 3px solid #fbbf24;
      padding-left: 8px;
      margin-left: -11px;
    }
    .ct-linenum {
      color: #3f3f46;
      user-select: none;
      font-size: 17px;
      width: 28px;
    }
    .ct-linetext .kw { color: #f43f5e; font-weight: 700; }
    .ct-linetext .fn { color: #38bdf8; font-weight: 600; }
    .ct-linetext .str { color: #34d399; }
    .ct-linetext .comm { color: #52525b; font-style: italic; }

    .ct-terminal {
      width: 100%;
      background: #09090b;
      border: 1.5px solid #27272a;
      border-radius: 14px;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
    }
    .term-bar {
      display: flex;
      justify-content: space-between;
      padding: 10px 18px;
      background: #121215;
      border-bottom: 1px solid #27272a;
      font-size: 13px;
      color: #71717a;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .term-body {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .term-cmd { display: flex; gap: 12px; font-size: 18px; color: #ffffff; }
    .term-cmd .prompt { color: #10b981; font-weight: 700; }
    .term-out {
      font-size: 16px;
      color: #a1a1aa;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    /* 4. Metrics Comparison Styling */
    .comp-metrics-comp {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 940px;
    }
    .mc-title {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 36px;
      text-transform: uppercase;
      color: #ffffff;
    }
    .mc-cards {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
      margin-bottom: 34px;
    }
    .mc-card {
      background: #0d0d11;
      border: 1.5px solid #27272a;
      border-radius: 16px;
      padding: 26px 30px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .mc-card.winner {
      border-color: #10b981;
      background: #081a13;
    }
    .mc-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mc-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #d4d4d8;
    }
    .mc-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      background: #27272a;
      color: #a1a1aa;
    }
    .mc-tag.green {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .mc-num {
      font-size: 58px;
      font-weight: 900;
      letter-spacing: -1.5px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .mc-bar-track {
      width: 100%;
      height: 12px;
      background: #18181b;
      border-radius: 6px;
      overflow: hidden;
    }
    .mc-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.05s linear;
    }
    .mc-delta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 36px;
      border-radius: 8px;
      background: #10b981;
      border: 3px solid #09090b;
      box-shadow: 0 6px 0px #09090b;
      color: #052e16;
    }
    .mc-delta-text {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    /* 5. Memory Layout Styling */
    .comp-memory-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 960px;
    }
    .ml-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 30px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .ml-table {
      width: 100%;
      background: #0d0d11;
      border: 1.5px solid #27272a;
      border-radius: 16px;
      padding: 18px 24px;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 28px;
    }
    .ml-table-head {
      display: flex;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
      color: #71717a;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .ml-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #18181b;
      font-size: 17px;
    }
    .ml-row:last-child { border-bottom: none; }
    .ml-addr {
      color: #38bdf8;
      font-weight: 700;
      width: 140px;
    }
    .ml-bytes { display: flex; gap: 10px; }
    .ml-bytes .byte {
      color: #d4d4d8;
      background: #18181b;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 16px;
    }
    .ml-bytes .byte.lead {
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
      font-weight: 700;
    }
    .ml-label {
      color: #a1a1aa;
      font-size: 15px;
      font-weight: 600;
      width: 220px;
      text-align: right;
    }
    .ml-latency {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
    }
    .lat-box {
      flex: 1;
      background: #0d0d11;
      border: 1.5px solid #27272a;
      border-radius: 14px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .lat-box.ram { border-color: #10b981; }
    .lat-box.nvme { border-color: #ef4444; }
    .lat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #71717a;
      letter-spacing: 1px;
    }
    .lat-val {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -1px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .lat-box.ram .lat-val { color: #10b981; }
    .lat-box.nvme .lat-val { color: #ef4444; }
    .lat-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #a1a1aa;
      font-weight: 600;
    }
    .lat-vs {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 900;
      color: #52525b;
    }

    /* Universal Component Container & Canvas Styling */
    [class^="comp-"] {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 960px;
      position: relative;
    }
    [class^="comp-"] canvas {
      display: block;
      max-width: 960px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      SEDEV 60S ENGINE
      <span style="font-size:10px; color:#10b981; margin-left:auto; font-family:'JetBrains Mono'; background:#06261c; padding:3px 8px; border-radius:4px; border:1px solid #059669; font-weight:800;">41 VÍDEOS</span>
    </div>

    <!-- Master Video Selector Directly in UI -->
    <div class="video-selector-wrap">
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #a1a1aa; text-transform: uppercase; display:flex; justify-content:space-between; align-items:center;">
        <span>CATÁLOGO DE VÍDEOS</span>
        <span id="videoIndexLabel" style="color:#fbbf24; font-family:'JetBrains Mono'; font-size:12px;">1 / 41</span>
      </div>

      <select id="videoSelect" class="catalog-dropdown" onchange="onVideoSelectChange(parseInt(this.value, 10))"></select>

      <div class="catalog-nav-row">
        <button class="nav-btn" onclick="navigateVideo(-1)" title="Vídeo anterior ([)">◀ Ant</button>
        <button class="nav-btn toggle-var" id="varToggleBtn" onclick="toggleVariation()" title="Alternar entre Variación A y B">Var B ⇄</button>
        <button class="nav-btn" onclick="navigateVideo(1)" title="Vídeo siguiente (])">Sig ▶</button>
      </div>
    </div>

    <!-- Active Video Info Card -->
    <div class="manifest-info">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span id="mCategory" class="badge-category">ARQUITECTURA</span>
        <span id="mVariation" class="badge-var">VAR A</span>
      </div>
      <div class="manifest-title" id="mTitle">Cargando manifiesto...</div>
      <div class="manifest-meta" id="mMeta">0 escenas // 0.0s total</div>
    </div>

    <button class="load-btn" onclick="document.getElementById('filePicker').click()">
      📂 Cargar archivo JSON externo...
    </button>
    <input type="file" id="filePicker" accept=".json" style="display:none;" onchange="handleFileSelect(event)">

    <div style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #71717a; text-transform: uppercase;">ESCENAS DEL VÍDEO</div>
    <div class="scene-list" id="sceneList"></div>
  </div>

  <!-- Viewport -->
  <div class="viewport">
    <div class="stage-wrapper" id="stageWrapper">
      <div id="stageScaler">
        <div id="stage">
          <canvas id="stageBgCanvas" width="1080" height="1920" style="position:absolute; top:0; left:0; width:1080px; height:1920px; z-index:0; pointer-events:none;"></canvas>
          <div id="stageContent" style="position:relative; z-index:2; width:1080px; height:1920px; display:flex; flex-direction:column; align-items:center; justify-content:center;"></div>
        </div>
      </div>
    </div>

    <!-- Playback Bar -->
    <div class="playback-bar">
      <!-- Live Teleprompter Cue -->
      <div class="teleprompter-box" id="teleprompterBox">
        <div class="tp-cue" id="tpCue">Cargando guion...</div>
        <div class="tp-text" id="tpText">Locución...</div>
      </div>

      <div class="bar-controls">
        <button class="play-btn" id="playBtn">▶ REPRODUCIR</button>
        <span class="time-display" id="timeDisplay">00.0s / 60.0s</span>
      </div>
      <input type="range" class="scrubber" id="scrubber" min="0" max="60" step="0.033" value="0">
    </div>
  </div>

  <!-- Component Registry Definition -->
  <script>
    window.__COMPONENTS__ = {};
    window.registerComponent = function(name, def) {
      window.__COMPONENTS__[name] = def;
    };
  </script>

  <!-- Motion Graphics Utilities & Atmospheric Background -->
  <script src="templates/components/motion_utils.js"></script>

  <!-- Component Scripts & Icons -->
  <script src="templates/components/icons_sedev.js"></script>
  <script src="templates/components/kinetic_hook.js"></script>
  <script src="templates/components/architecture_flow.js"></script>
  <script src="templates/components/code_terminal.js"></script>
  <script src="templates/components/metrics_comparison.js"></script>
  <script src="templates/components/memory_layout.js"></script>
  <script src="templates/components/tree_hierarchy.js"></script>
  <script src="templates/components/network_pipeline.js"></script>
  <script src="templates/components/latency_scale.js"></script>
  <script src="templates/components/tradeoff_matrix.js"></script>
  <script src="templates/components/terminal_split.js"></script>
  <script src="templates/components/storage_engine_viz.js"></script>
  <script src="templates/components/connection_pool_viz.js"></script>
  <script src="templates/components/kernel_sandbox_viz.js"></script>
  <script src="templates/components/cache_flow_viz.js"></script>
  <script src="templates/components/migration_stepper_viz.js"></script>
  <script src="templates/components/quantization_weights_viz.js"></script>

  <!-- Master Video Catalog Bundle (41 Videos Preloaded) -->
  <script src="manifests/all_manifests_bundle.js"></script>
  <script src="manifests/ejemplo_redis_60s.js"></script>

  <script>
    // Math Utilities
    const utils = {
      spring(dt, omega = 24, zeta = 0.65) {
        if (dt <= 0) return 0;
        const decay = Math.exp(-zeta * omega * dt);
        const beta = omega * Math.sqrt(1 - zeta * zeta);
        return 1 - decay * (Math.cos(beta * dt) + (zeta / Math.sqrt(1 - zeta * zeta)) * Math.sin(beta * dt));
      },
      clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      },
      lerp(a, b, t) {
        return a + (b - a) * t;
      }
    };

    let manifest = null;
    let totalDuration = 60.0;
    let currentTime = 0;
    let isPlaying = false;
    let lastTimestamp = null;
    let activeSceneIndex = -1;
    let currentScene = null;
    let currentComponent = null;

    let catalog = window.__BIBLIOTECA_2026__ || [];
    let currentVideoIndex = 0;

    const stageEl = document.getElementById('stage');
    const stageContent = document.getElementById('stageContent');
    const bgCanvas = document.getElementById('stageBgCanvas');
    const bgCtx = bgCanvas ? bgCanvas.getContext('2d') : null;
    const stageScaler = document.getElementById('stageScaler');
    const stageWrapper = document.getElementById('stageWrapper');
    const playBtn = document.getElementById('playBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const scrubber = document.getElementById('scrubber');
    const mTitle = document.getElementById('mTitle');
    const mMeta = document.getElementById('mMeta');
    const mCategory = document.getElementById('mCategory');
    const mVariation = document.getElementById('mVariation');
    const sceneList = document.getElementById('sceneList');
    const tpCue = document.getElementById('tpCue');
    const tpText = document.getElementById('tpText');
    const videoSelect = document.getElementById('videoSelect');
    const videoIndexLabel = document.getElementById('videoIndexLabel');
    const varToggleBtn = document.getElementById('varToggleBtn');

    // Auto-scale stage to fit stageWrapper cleanly
    function resizeStage() {
      const wrapperHeight = stageWrapper.clientHeight;
      const scale = wrapperHeight / 1920;
      stageScaler.style.transform = `scale(${scale})`;
      stageWrapper.style.width = `${1080 * scale}px`;
    }
    window.addEventListener('resize', resizeStage);

    function loadManifestData(data) {
      manifest = data;
      totalDuration = manifest.scenes.reduce((acc, s) => acc + (s.duration || 5.0), 0);
      mTitle.innerText = manifest.title;
      mMeta.innerText = `${manifest.scenes.length} escenas // ${totalDuration.toFixed(1)}s total @ ${manifest.fps || 30}fps`;
      scrubber.max = totalDuration;

      // Populate Scenes list
      sceneList.innerHTML = '';
      manifest.scenes.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = 'scene-item';
        item.id = `sItem_${idx}`;
        item.innerHTML = `
          <div>
            <div class="scene-name">${idx + 1}. ${s.type}</div>
            <div style="font-size:11px; color:#71717a;">${s.id}</div>
          </div>
          <span class="scene-dur">${s.duration.toFixed(1)}s</span>
        `;
        item.onclick = () => jumpToScene(idx);
        sceneList.appendChild(item);
      });

      activeSceneIndex = -1;
      resizeStage();
      seek(0);
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          mCategory.innerText = 'EXTERNO';
          mVariation.innerText = 'CUSTOM';
          videoIndexLabel.innerText = 'EXT';
          loadManifestData(data);
        } catch (err) {
          alert('Error leyendo JSON: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    function loadScene(sceneData) {
      currentScene = sceneData;
      stageContent.innerHTML = '';
      const compDef = window.__COMPONENTS__[sceneData.type];
      if (!compDef) {
        stageContent.innerHTML = `<div style="color:red; font-size:32px;">Component not found: ${sceneData.type}</div>`;
        return;
      }
      currentComponent = compDef;
      if (typeof compDef.init === 'function') {
        compDef.init(stageContent, sceneData.props || {});
      }
    }

    function renderFrame(timeInSeconds) {
      if (!currentScene || !currentComponent) return;
      const duration = currentScene.duration || 5.0;
      const t = utils.clamp(timeInSeconds, 0, duration);

      // Render dynamic ambient lighting & telemetry background
      if (bgCtx && window.motionUtils && typeof window.motionUtils.renderBackdrop === 'function') {
        const meta = {
          category: (manifest && manifest.category) || 'SYSTEMS',
          slug: (manifest && manifest.slug) || '',
          title: (manifest && manifest.title) || ''
        };
        window.motionUtils.renderBackdrop(bgCtx, 1080, 1920, t, meta);
      }

      // Subtle dynamic camera push-in on stage content
      const camPush = 1.0 + (t / duration) * 0.035;
      stageContent.style.transform = `scale(${camPush.toFixed(4)})`;

      currentComponent.render(stageContent, t, duration, currentScene.props || {}, utils);
    }

    function getSceneAtTime(time) {
      let accumulated = 0;
      for (let i = 0; i < manifest.scenes.length; i++) {
        const s = manifest.scenes[i];
        if (time >= accumulated && time < accumulated + s.duration) {
          return { index: i, scene: s, sceneTime: time - accumulated };
        }
        accumulated += s.duration;
      }
      const lastIdx = manifest.scenes.length - 1;
      return { index: lastIdx, scene: manifest.scenes[lastIdx], sceneTime: manifest.scenes[lastIdx].duration };
    }

    function jumpToScene(targetIdx) {
      let accumulated = 0;
      for (let i = 0; i < targetIdx; i++) {
        accumulated += manifest.scenes[i].duration;
      }
      seek(accumulated + 0.05);
    }

    function seek(time) {
      currentTime = Math.max(0, Math.min(time, totalDuration));
      scrubber.value = currentTime;
      timeDisplay.innerText = `${currentTime.toFixed(1).padStart(4, '0')}s / ${totalDuration.toFixed(1)}s`;

      const info = getSceneAtTime(currentTime);
      if (info.index !== activeSceneIndex) {
        activeSceneIndex = info.index;
        // Update sidebar highlights
        document.querySelectorAll('.scene-item').forEach(el => el.classList.remove('active'));
        const activeEl = document.getElementById(`sItem_${activeSceneIndex}`);
        if (activeEl) activeEl.classList.add('active');

        // Load new scene
        loadScene(info.scene);
      }

      // Render exact frame timestamp
      renderFrame(info.sceneTime);

      // Update live teleprompter display
      if (info.scene) {
        tpCue.innerText = `[${info.index + 1}/${manifest.scenes.length}] ACCIÓN: ${info.scene.visual_cue || info.scene.id}`;
        tpText.innerText = info.scene.voiceover ? `"${info.scene.voiceover}"` : '(Sin locución asignada)';
      }
    }

    // Playback loop
    function loop(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      currentTime += dt;
      if (currentTime >= totalDuration) {
        currentTime = 0;
        seek(0);
        isPlaying = false;
        playBtn.innerText = '▶ REPRODUCIR';
      } else {
        seek(currentTime);
        requestAnimationFrame(loop);
      }
    }

    playBtn.onclick = () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playBtn.innerText = '⏸ PAUSAR';
        lastTimestamp = null;
        requestAnimationFrame(loop);
      } else {
        playBtn.innerText = '▶ REPRODUCIR';
      }
    };

    scrubber.oninput = (e) => {
      if (isPlaying) {
        isPlaying = false;
        playBtn.innerText = '▶ REPRODUCIR';
      }
      seek(parseFloat(e.target.value));
    };

    // ----------------------------------------------------
    // Video Catalog Integration (41 Videos Built-in)
    // ----------------------------------------------------
    function initCatalog() {
      if (!catalog || catalog.length === 0) {
        if (window.__DEFAULT_MANIFEST__) {
          loadManifestData(window.__DEFAULT_MANIFEST__);
        }
        return;
      }

      // Populate Dropdown with optgroups
      videoSelect.innerHTML = '';
      const groups = {};
      catalog.forEach((item, idx) => {
        const g = item.group || 'Varios';
        if (!groups[g]) groups[g] = [];
        groups[g].push({ item, idx });
      });

      Object.entries(groups).forEach(([groupName, items]) => {
        const optgroup = document.createElement('optgroup');
        optgroup.label = groupName;
        items.forEach(({ item, idx }) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.innerText = item.label;
          optgroup.appendChild(opt);
        });
        videoSelect.appendChild(optgroup);
      });

      // Default to Topic 01 Var A (index 1) or Redis Demo (index 0)
      const defaultIdx = catalog.length > 1 ? 1 : 0;
      selectVideoByIndex(defaultIdx);
    }

    function selectVideoByIndex(idx) {
      if (!catalog || catalog.length === 0) return;
      currentVideoIndex = (idx + catalog.length) % catalog.length;
      videoSelect.value = currentVideoIndex;

      const item = catalog[currentVideoIndex];
      videoIndexLabel.innerText = `${currentVideoIndex + 1} / ${catalog.length}`;
      mCategory.innerText = item.category || 'SEDEV';
      mVariation.innerText = item.variation ? `VAR ${item.variation}` : 'DEMO';

      if (item.key && item.key.endsWith('_A')) {
        varToggleBtn.innerText = 'Ver Var B ⇄';
        varToggleBtn.title = 'Cambiar a Variación B (Polémica)';
      } else if (item.key && item.key.endsWith('_B')) {
        varToggleBtn.innerText = 'Ver Var A ⇄';
        varToggleBtn.title = 'Cambiar a Variación A (Técnica)';
      } else {
        varToggleBtn.innerText = 'Var A ⇄';
      }

      if (isPlaying) {
        isPlaying = false;
        playBtn.innerText = '▶ REPRODUCIR';
      }

      loadManifestData(item.manifest);
    }

    function onVideoSelectChange(idx) {
      selectVideoByIndex(idx);
    }

    function navigateVideo(step) {
      selectVideoByIndex(currentVideoIndex + step);
    }

    function toggleVariation() {
      const current = catalog[currentVideoIndex];
      if (!current || !current.key) return;

      let targetKey = null;
      if (current.key.endsWith('_A')) {
        targetKey = current.key.replace('_A', '_B');
      } else if (current.key.endsWith('_B')) {
        targetKey = current.key.replace('_B', '_A');
      } else {
        targetKey = '01_A';
      }

      const foundIdx = catalog.findIndex(v => v.key === targetKey);
      if (foundIdx !== -1) {
        selectVideoByIndex(foundIdx);
      }
    }

    // Keyboard Shortcuts: Space (Play/Pause), [ and ] (Prev/Next Video), V (Toggle Var)
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (e.code === 'Space') {
        e.preventDefault();
        playBtn.click();
      } else if (e.code === 'BracketLeft' || e.code === 'PageUp') {
        navigateVideo(-1);
      } else if (e.code === 'BracketRight' || e.code === 'PageDown') {
        navigateVideo(1);
      } else if (e.key === 'v' || e.key === 'V') {
        toggleVariation();
      } else if (e.code === 'ArrowLeft') {
        seek(Math.max(0, currentTime - 1.0));
      } else if (e.code === 'ArrowRight') {
        seek(Math.min(totalDuration, currentTime + 1.0));
      }
    });

    // Initialize Catalog on startup
    initCatalog();
  </script>
</body>
</html>
